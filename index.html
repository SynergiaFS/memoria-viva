document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-act]");if(!t)return;const a=t.dataset.act;const d=t.dataset;
  if(a==="modalbg"){if(e.target===t)closeModal();return}
  const n=ui.noteId?state.notes[ui.noteId]:null;
  switch(a){
    case "go":go(d.view);break;
    case "newnote":editImgs=[];noteModal(null);break;
    case "editnote":editImgs=[];noteModal(state.notes[d.id]);break;
    case "closemodal":closeModal();break;
    case "open":ui.noteId=d.id;ui.tool=d.tool||"texto";ui.quiz=null;ui.exam=null;ui.recall=false;ui.revealed=new Set();ui.confirmDel=null;ui.view="apuntes";try{history.replaceState(null,"","#apuntes")}catch{}render();window.scrollTo(0,0);break;
    case "filter":ui.filter=d.f;render();break;
    case "tool":ui.tool=d.tool;if(d.tool!=="mapa")ui.recall=false;render();break;
    case "askdel":ui.confirmDel=d.id;render();break;
    case "canceldel":ui.confirmDel=null;render();break;
    case "delnote":{const id=d.id;const note=state.notes[id];if(note&&note.example){getMeta().hideExample=true;saveMeta()}
      delete state.notes[id];delete state.outs[id];delete state.decks[id];Store.del("n_"+id);Store.del("o_"+id);Store.del("d_"+id);ui.noteId=null;ui.confirmDel=null;toast("Apunte borrado");go("apuntes");break}
    case "gen":if(n)gen(n,d.kind);break;
    case "genlocal":if(n)gen(n,d.kind,true);break;
    case "tipok":lsSet("mv_tip","1");render();break;
    case "read":{const r=readPrefs();r[d.k]=d.v;lsSet("mv_read",JSON.stringify(r));applyRead();document.querySelectorAll(`[data-act="read"][data-k="${d.k}"]`).forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===d.v)));break}
    case "kbd":ui.kbd=d.k;lsSet("mv_kbd",d.k);document.querySelectorAll('[data-act="kbd"]').forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.k===ui.kbd)));if($("#modalRoot").innerHTML===""||!t.closest(".modal"))render();break;
    case "speak":speak(d.text,d.lang);break;
    case "typedmode":ui.typed=d.v==="1";lsSet("mv_typed",ui.typed?"1":"0");if(ui.review){ui.review.shown=false;ui.review.verdict=null}render();setTimeout(()=>{const x=$("#typedIn");if(x)x.focus()},0);break;
    case "strict":ui.strict=!ui.strict;lsSet("mv_strict",ui.strict?"1":"0");render();break;
    case "tradcards":{const tr=ui.trad;if(!tr||!tr.res||!tr.res.tarjetas)break;const dk=deckOf(d.id);const ex=new Set(dk.cards.map(c=>norm(c.f)));let k=0;tr.res.tarjetas.forEach(c=>{if(c&&c.f&&c.b&&!ex.has(norm(c.f))){dk.cards.push({id:uid(),f:String(c.f),b:String(c.b)});ex.add(norm(c.f));k++}});saveDeck(d.id);tr.res.tarjetas=[];toast(k+" tarjetas añadidas");render();break}
    case "stopai":stopAI(d.key);break;
    case "recall":ui.recall=d.v==="1";ui.revealed=new Set();render();break;
    case "reveal":ui.revealed.add(Number(d.i));render();break;
    case "delcard":{const dk=deckOf(d.id);dk.cards=dk.cards.filter(c=>c.id!==d.c);saveDeck(d.id);render();break}
    case "reviewnote":startReview(d.id);break;
    case "startreview":startReview();break;
    case "flip":ui.review.shown=true;render();break;
    case "rate":rate(Number(d.r));break;
    case "endreview":ui.review.done=true;saveMeta();render();break;
    case "startquiz":ui.quiz={noteId:d.id,i:0,ans:[]};render();break;
    case "answer":ui.quiz.ans[ui.quiz.i]=Number(d.i);render();break;
    case "nextq":ui.quiz.i++;if(ui.quiz.i>=outsOf(ui.quiz.noteId).quiz.length)markActive(),saveMeta();render();break;
    case "failstocards":{const o=outsOf(d.id);const dk=deckOf(d.id);const ex=new Set(dk.cards.map(c=>c.f));let k=0;
      o.quiz.forEach((q,i)=>{if(ui.quiz.ans[i]!==q.c&&!ex.has(q.p)){dk.cards.push({id:uid(),f:q.p,b:q.o[q.c]+(q.e?" · "+q.e:"")});k++}});saveDeck(d.id);toast(k+" tarjetas añadidas");break}
    case "startexam":{const mins=Number(($("#examTime")||{}).value||ui.exam?.mins||0);ui.exam={noteId:d.id,ansT:[],ansA:[],graded:null,mins,end:mins?Date.now()+mins*60000:0};render();startExamClock();break}
    case "quitexam":ui.exam=null;render();break;
    case "ttsplay":ttsPlay(d.id);break;
    case "ttsstop":ttsStop();break;
    case "settings":ui.editProf=null;ui.confirmProf=null;settingsModal();break;
    case "switchprof":state.pid=d.id;saveProfiles();ensureExample(d.id);ui.noteId=null;ui.review=null;closeModal();go("hoy");toast("Perfil: "+prof().name);break;
    case "editprof":ui.editProf=d.id;ui.confirmProf=null;settingsModal();break;
    case "askdelprof":ui.confirmProf=d.id;settingsModal();break;
    case "cancelprof":ui.confirmProf=null;settingsModal();break;
    case "delprof":{const pid=d.id;Object.values(state.notes).filter(x=>x.pid===pid).forEach(x=>{delete state.notes[x.id];delete state.outs[x.id];delete state.decks[x.id];Store.del("n_"+x.id);Store.del("o_"+x.id);Store.del("d_"+x.id)});
      state.profiles=state.profiles.filter(p=>p.id!==pid);delete state.metas[pid];Store.del("m_"+pid);if(state.pid===pid)state.pid=state.profiles[0].id;saveProfiles();ui.editProf=null;ui.confirmProf=null;settingsModal();render();break}
    case "hideex":{getMeta().hideExample=true;saveMeta();const id="ej-"+state.pid;if(!Store.map["n_"+id]){delete state.notes[id];delete state.outs[id];delete state.decks[id]}settingsModal();render();break}
    case "showex":getMeta().hideExample=false;saveMeta();ensureExample(state.pid);settingsModal();render();break;
    case "export":doExport();break;
    case "import":$("#importFile").click();break;
    case "addexam":examModal();break;
    case "aitest":{const out=$("#aiTestOut");out.textContent="Probando…";try{await llm("Responde solo con la palabra: listo");out.textContent="Conexión correcta";out.style.color="var(--ok)"}catch(e2){out.textContent=errMsg(e2);out.style.color="var(--bad)"}break}
    case "taskdone":markTask(d.k,d.e,d.t,d.min);break;
    case "askdelexam":ui.confirmExam=d.id;render();break;
    case "canceldelexam":ui.confirmExam=null;render();break;
    case "eknow":ui.eknow=d.v;document.querySelectorAll('[data-act="eknow"]').forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===d.v)));examEstimate();break;
    case "delexam":{const m=getMeta();m.exams=m.exams.filter(x=>x.id!==d.id);ui.confirmExam=null;saveMeta();render();break}
    case "rmimg":{const im=editImgs.splice(Number(d.i),1)[0];if(im)URL.revokeObjectURL(im.url);renderThumbs();break}
    case "transcribe":transcribe();break;
    case "preset":T.preset=d.k;saveTimerPref();render();break;
    case "tblocks":T.total=Number(d.n);saveTimerPref();render();break;
    case "tbrk":T.brkMode=d.k;saveTimerPref();render();break;
    case "tstart":ui.dump=null;tStart();break;
    case "tpause":tPause();break;
    case "tskip":advance();break;
    case "tend":finishSession(false);break;
    case "closedump":ui.dump=null;render();break;
    case "dumpcards":{const D=ui.dump;if(!D.noteId)break;const dk=deckOf(D.noteId);D.res.olvidado.forEach(x=>dk.cards.push({id:uid(),f:"Explica: "+String(x).slice(0,300),b:"Revisa en tus apuntes: "+String(x).slice(0,300)}));saveDeck(D.noteId);toast("Tarjetas creadas. Edítalas en el apunte para afinar la respuesta.");break}
  }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="fileIn")handleFiles([...t.files]).then(()=>{t.value=""});
  else if(t.id==="nl"){t.dataset.touched="1";const nx=$("#nx");if(nx)nx.dataset.kbd=LANGS[t.value]&&LANGS[t.value].kbd||""}
  else if(["xd","xn","xp","xwd","xwe"].includes(t.id))examEstimate();
  else if(t.id==="aiProv"){AIC.provider=t.value;AIC.key=$("#aiKey").value.trim();AIC.model="";settingsModal()}
  else if(t.id==="ttsRate"){getMeta().rate=Number(t.value);saveMeta()}
  else if(t.id==="ttsVoice"){getMeta().voice=t.value;saveMeta()}
  else if(t.id==="importFile"&&t.files[0])doImport(t.files[0]).then(()=>{t.value=""});
  else if(t.id==="dumpNote"&&ui.dump){ui.dump.noteId=t.value||null}
  else if(t.name&&t.name.startsWith("t")&&ui.exam&&t.type==="radio"){ui.exam.ansT[Number(t.name.slice(1))]=Number(t.value)}
});
document.addEventListener("input",e=>{
  const t=e.target;
  if((t.tagName==="TEXTAREA"||(t.tagName==="INPUT"&&t.type==="text"))&&!e.isComposing)applyKbd(t);
  if(["xn","xp","xwd","xwe"].includes(t.id))examEstimate();
  if(t.id==="ns"){const g=guessLang(t.value);const sel=$("#nl");if(sel&&g&&!sel.dataset.touched){sel.value=g;const nx=$("#nx");if(nx)nx.dataset.kbd=LANGS[g].kbd||""}}
  if(t.id&&t.id.startsWith("ea-")&&ui.exam)ui.exam.ansA[Number(t.id.slice(3))]=t.value;
  else if(t.id==="dumpText"&&ui.dump)ui.dump.text=t.value;
  else if(t.id&&t.id.startsWith("fy-t-")){const id=t.id.slice(5);ui.fey[id]=ui.fey[id]||{};ui.fey[id].text=t.value}
  else if(t.id&&t.id.startsWith("fy-c-")){const id=t.id.slice(5);ui.fey[id]=ui.fey[id]||{};ui.fey[id].concept=t.value}
});
document.addEventListener("click",e=>{if(e.target.closest("#drop"))$("#fileIn").click()});
document.addEventListener("dragover",e=>{const dz=e.target.closest&&e.target.closest("#drop");if(dz){e.preventDefault();dz.classList.add("over")}});
document.addEventListener("dragleave",e=>{const dz=e.target.closest&&e.target.closest("#drop");if(dz)dz.classList.remove("over")});
document.addEventListener("drop",e=>{const dz=e.target.closest&&e.target.closest("#drop");if(dz){e.preventDefault();dz.classList.remove("over");handleFiles([...e.dataTransfer.files])}});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&$("#modalRoot").innerHTML){closeModal();return}
  if(e.target.closest("[data-act='reveal']")&&(e.key==="Enter"||e.key===" ")){e.preventDefault();e.target.closest("[data-act]").click();return}
  if(e.target.closest("#drop")&&(e.key==="Enter"||e.key===" ")){e.preventDefault();$("#fileIn").click();return}
  if(ui.view==="repasar"&&ui.review&&!ui.review.done&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)&&!$("#modalRoot").innerHTML){
    if(!ui.review.shown&&(e.key===" "||e.key==="Enter")){e.preventDefault();ui.review.shown=true;render()}
    else if(ui.review.shown&&/^[1-4]$/.test(e.key)){rate(Number(e.key))}
  }
});
document.addEventListener("submit",async e=>{
  const f=e.target.closest("form[data-form]");if(!f)return;e.preventDefault();const kind=f.dataset.form;const id=f.dataset.id;
  if(kind==="note"){
    const title=$("#nt").value.trim(),subject=$("#ns").value.trim(),text=$("#nx").value,lang=$("#nl").value;
    if(!title)return;
    if(editImgs.length&&!confirmImgs){confirmImgs=true;toast("Tienes fotos sin transcribir. Pulsa Guardar otra vez para guardar sin ellas.");return}
    confirmImgs=false;
    let note=id?state.notes[id]:null;
    if(note){note=Object.assign({},note,{title,subject,text,lang});if(note.example){note.example=false}}
    else note={id:uid(),pid:state.pid,title,subject,text,lang,created:Date.now()};
    saveNote(note);if(state.outs[note.id]&&Store.map["o_"+note.id]===undefined&&id&&id.startsWith("ej-"))saveOuts(note.id);
    if(id&&id.startsWith("ej-")&&state.decks[id])saveDeck(id);
    closeModal();ui.noteId=note.id;ui.tool="texto";ui.view="apuntes";render();toast("Apunte guardado");
  }
  else if(kind==="addcard"){const fi=$("#cf-"+id),bi=$("#cb-"+id);if(!fi.value.trim()||!bi.value.trim())return;deckOf(id).cards.push({id:uid(),f:fi.value.trim(),b:bi.value.trim()});saveDeck(id);render();setTimeout(()=>{const x=$("#cf-"+id);if(x)x.focus()},0)}
  else if(kind==="exam"){
    const n=state.notes[id];const ex=outsOf(id).exam;const st=ui.exam;if(!n||!ex||!st)return;
    ex.abiertas.forEach((_,i)=>{const ta=$("#ea-"+i);if(ta)st.ansA[i]=ta.value});
    await runAI(id+":nota",async signal=>{
      if(hasAI()){
        const items=ex.abiertas.map((q,i)=>`PREGUNTA ${i+1}: ${q.p}\nPUNTOS CLAVE: ${(q.clave||[]).join("; ")}\nRESPUESTA DEL ALUMNO: ${st.ansA[i]||"(en blanco)"}`).join("\n\n");
        const r=await llm(aiCtx(n)+`Corrige estas respuestas de examen como un profesor justo y exigente de ${prof().level}. Puntúa de 0 a 10 según cuántos puntos clave cubre correctamente y la precisión. En blanco vale 0. Formato: JSON array, un objeto por pregunta en orden: [{"nota":7,"bien":"qué está bien","falta":"qué faltaba o era incorrecto","modelo":"respuesta modelo breve"}].\n\n${items}`,{json:true,signal});
        if(!Array.isArray(r))throw{code:"json"};st.graded=r;st.mode="ia";
      }else{st.graded=gradeLocal(ex,st.ansA);st.mode="local"}
      markActive();saveMeta();
    });
  }
  else if(kind==="fey"){
    const n=state.notes[id];const concept=$("#fy-c-"+id).value.trim(),text=$("#fy-t-"+id).value.trim();
    if(text.length<40){toast("Escribe un poco más: al menos un par de frases.");return}
    ui.fey[id]={concept,text};
    await runAI(id+":fey",async signal=>{
      ui.fey[id].res=hasAI()?await llm(aiCtx(n)+`El estudiante intenta explicar "${concept}" con sus palabras, sin mirar los apuntes. Evalúa su comprensión con los apuntes como referencia. Sé concreto, amable y honesto. Formato JSON: {"nota":0,"bien":["..."],"lagunas":["ideas importantes que no menciona"],"errores":["confusiones o errores, con la corrección"],"siguiente":"una pregunta de por qué o cómo para profundizar"}.\n\nEXPLICACIÓN DEL ESTUDIANTE:\n"""${text.slice(0,8000)}"""`,{json:true,signal}):localFey(n,concept,text);
      markActive();
    });
  }
  else if(kind==="tutor"){
    const n=state.notes[id];const inp=$("#tutorIn");const q=inp.value.trim();if(!q)return;
    const turns=ui.chat[id]=ui.chat[id]||[];turns.push({role:"user",content:q});
    const rules=aiCtx(n)+"Actúa como tutor socrático. Ante una duda, primero comprueba qué sabe el estudiante y guíale con una pista o una pregunta; si tras dos intentos no llega, explícalo con claridad y un ejemplo concreto. Respuestas breves (máx. 120 palabras), sin Markdown. Si pregunta algo ajeno al tema, reconduce con amabilidad.";
    await runAI(id+":tutor",async signal=>{
      const r=hasAI()?await llm([{role:"user",content:rules},...turns.slice(-12)],{signal}):localTutor(n,q);
      turns.push({role:"assistant",content:r});
    });
    setTimeout(()=>{const x=$("#tutorIn");if(x)x.focus()},0);
  }
  else if(kind==="vocab"){
    const ta=$("#vocIn-"+id);const pairs=parseVocab(ta.value);const rev=$("#vocRev-"+id).checked;
    if(!pairs.length){toast("No reconozco el formato. Usa una línea por palabra: palabra - significado.");return}
    const dk=deckOf(id);const ex=new Set(dk.cards.map(c=>norm(c.f)));let k=0;
    pairs.forEach(p=>{if(!ex.has(norm(p.f))){dk.cards.push({id:uid(),f:p.f,b:p.b});ex.add(norm(p.f));k++}
      if(rev&&!ex.has(norm(p.b))){dk.cards.push({id:uid(),f:p.b,b:p.f,rev:true});ex.add(norm(p.b));k++}});
    saveDeck(id);toast(k+" tarjetas añadidas");render();
  }
  else if(kind==="trad"){
    const n=state.notes[id];const src=$("#trSrc").value.trim(),mine=$("#trMine").value.trim();
    if(!src){toast("Escribe primero el texto original.");return}
    ui.trad={noteId:id,src,mine};
    await runAI(id+":trad",async signal=>{
      ui.trad.gloss=glossary(n,src);
      if(hasAI()){
        if(!mine)throw{code:"nomine"};
        ui.trad.res=await llm(aiCtx(n)+`El estudiante traduce este texto. Corrige su traducción como un profesor de ${prof().level}: valora el sentido y el análisis, no solo la literalidad. Formato JSON: {"nota":0,"traduccion":"traducción correcta y natural","analisis":[{"palabra":"forma del texto","analisis":"análisis morfológico y función sintáctica","significado":"enunciado de diccionario y significado"}],"bien":["..."],"errores":["error y corrección"],"tarjetas":[{"f":"enunciado de diccionario","b":"significado"}]}. En "tarjetas" pon solo 2-6 palabras importantes del texto.\n\nTEXTO ORIGINAL:\n${src}\n\nTRADUCCIÓN DEL ESTUDIANTE:\n${mine}`,{json:true,signal});
        ui.trad.gloss=null;
      }
      markActive();
    });
  }
  else if(kind==="typed"){
    const R=ui.review;if(!R)return;const inp=$("#typedIn");R.given=inp?inp.value:"";
    const it=R.queue[R.i];const c=state.decks[it.noteId].cards.find(x=>x.id===it.card.id)||it.card;
    R.verdict=cmpAnswer(R.given,c.b,ui.strict);R.shown=true;render();
  }
  else if(kind==="ai"){
    AIC.provider=$("#aiProv").value;AIC.key=$("#aiKey").value.trim();AIC.model=$("#aiModel").value.trim();saveAIC();
    toast(AIC.provider==="none"?"Modo sin IA":"IA guardada");settingsModal();render();
  }
  else if(kind==="prof"){
    const name=$("#pn").value.trim(),level=$("#pl").value;if(!name)return;
    if(id){const p=state.profiles.find(p=>p.id===id);if(p){p.name=name;p.level=level}}
    else{const p={id:"p"+uid(),name,level};state.profiles.push(p);ensureExample(p.id)}
    saveProfiles();ui.editProf=null;settingsModal();render();
  }
  else if(kind==="exam-add"){
    const subject=$("#xs").value.trim(),date=$("#xd").value;if(!subject||!date)return;
    const n=Math.max(1,Math.min(40,Number($("#xn").value)||1)),pages=Math.max(1,Number($("#xp").value)||n*8);
    const names=$("#xt").value.split(/\n+/).map(x=>x.trim()).filter(Boolean);
    const m=getMeta();m.daily={wd:Math.max(15,Number($("#xwd").value)||90),we:Math.max(0,Number($("#xwe").value)||0)};
    const temas=Array.from({length:n},(_,i)=>({id:uid(),name:names[i]||("Tema "+(i+1)),pages:pages/n,need:needBlocks(pages/n,ui.eknow),done:0,learnedOn:null,revs:[]}));
    m.exams.push({id:uid(),subject,date,created:Date.now(),level:ui.eknow,temas,sim:false});saveMeta();closeModal();go("hoy");toast("Plan creado");
  }
  else if(kind==="dump"){
    const D=ui.dump;D.text=$("#dumpText").value;D.noteId=$("#dumpNote").value||null;
    if(D.text.trim().length<20){toast("Escribe primero lo que recuerdes.");return}
    if(!D.noteId){toast("Elige el apunte para comparar.");return}
    const n=state.notes[D.noteId];
    await runAI("dump",async signal=>{
      D.res=hasAI()?await llm(aiCtx(n)+`El estudiante acaba de estudiar y ha escrito de memoria lo que recuerda. Compáralo con los apuntes. Formato JSON: {"recordado":["ideas clave que sí recuerda"],"olvidado":["ideas clave importantes que no aparecen, cada una en una frase"],"consejo":"qué repasar primero y cómo, en una frase"}. Máximo 6 elementos por lista.\n\nLO QUE RECUERDA:\n"""${D.text.slice(0,8000)}"""`,{json:true,signal}):localDump(n,D.text);
      markActive();saveMeta();
    });
  }
});
let confirmImgs=false;
let examClock=null;
function startExamClock(){clearInterval(examClock);examClock=setInterval(()=>{const st=ui.exam;if(!st||!st.end||st.graded){clearInterval(examClock);return}
  const left=st.end-Date.now();const el=$("#examClock");if(el){const v=Math.max(0,left);el.textContent=String(Math.floor(v/60000)).padStart(2,"0")+":"+String(Math.floor(v%60000/1000)).padStart(2,"0");el.style.color=left<300000?"var(--bad)":""}
  if(left<=0){clearInterval(examClock);toast("Tiempo. Entrega cuando quieras.")}},1000)}

/* lectura */
function readPrefs(){try{return Object.assign({size:"m",spacing:"normal",font:"atkinson"},JSON.parse(lsGet("mv_read")||"{}"))}catch{return{size:"m",spacing:"normal",font:"atkinson"}}}
function applyRead(){const r=readPrefs();const h=document.documentElement;h.dataset.size=r.size;h.dataset.spacing=r.spacing;h.dataset.font=r.font;
  if(r.font==="lexend"&&!document.getElementById("lexendFont")){const l=document.createElement("link");l.id="lexendFont";l.rel="stylesheet";l.href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;700&display=swap";document.head.appendChild(l)}}
function readSection(){const r=readPrefs();const seg=(k,opts)=>`<div class="seg">${opts.map(([v,l])=>`<button type="button" data-act="read" data-k="${k}" data-v="${v}" aria-pressed="${r[k]===v}">${l}</button>`).join("")}</div>`;
  return `<section class="stack"><span class="label">Lectura</span>
  <div class="stack" style="gap:6px"><span class="small"><b>Tamaño de letra</b></span>${seg("size",[["m","Normal"],["l","Grande"],["xl","Muy grande"]])}</div>
  <div class="stack" style="gap:6px"><span class="small"><b>Espaciado</b></span>${seg("spacing",[["normal","Normal"],["amplio","Amplio"]])}<span class="small muted">El espaciado amplio entre letras y palabras ayuda especialmente a quien tiene dislexia o se cansa leyendo.</span></div>
  <div class="stack" style="gap:6px"><span class="small"><b>Fuente</b></span>${seg("font",[["atkinson","Atkinson Hyperlegible"],["lexend","Lexend"],["sistema","Del sistema"]])}<span class="small muted">Atkinson Hyperlegible está diseñada para distinguir letras parecidas (I, l, 1 · O, 0). Si prefieres otra, ninguna fuente tiene ventaja demostrada para memorizar: elige la que te resulte más cómoda.</span></div>
  </section>`}

/* copias */
function doExport(){
  const data=JSON.stringify({app:"memoria-viva",v:1,at:new Date().toISOString(),map:Store.map});
  try{const b=new Blob([data],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="memoria-viva-copia-"+today()+".json";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast("Copia descargada")}
  catch{toast("No se pudo descargar la copia.")}
}
async function doImport(file){
  try{const j=JSON.parse(await file.text());if(!j||j.app!=="memoria-viva"||!j.map)throw 0;
    for(const [k,v] of Object.entries(j.map))Store.save(k,v);
    Object.assign(state,{notes:{},outs:{},decks:{},metas:{}});hydrate();closeModal();go("hoy");toast("Copia restaurada");
  }catch{toast("Ese archivo no es una copia válida de Memoria Viva.")}
}

/* ============ arranque ============ */
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(VIEWS.some(v=>v[0]===h)&&h!==ui.view)go(h)});
if(ttsOK())speechSynthesis.onvoiceschanged=()=>{if(ui.tool==="audio")render()};
(async function boot(){
  loadTimerPref();applyRead();
  ui.kbd=lsGet("mv_kbd")||"auto";ui.typed=lsGet("mv_typed")==="1";ui.strict=lsGet("mv_strict")!=="0";
  const h=location.hash.slice(1);if(VIEWS.some(v=>v[0]===h))ui.view=h;
  // estado inicial visible mientras conecta
  hydrate();state.ready=true;render();
  if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});
  addEventListener("online",render);addEventListener("offline",render);
  await Store.init();
  await Store.finish();
  Object.assign(state,{notes:{},outs:{},decks:{},metas:{}});hydrate();
  render();
})();
</script>
