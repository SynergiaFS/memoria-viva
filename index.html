<html lang="es">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#846044">
<meta name="description" content="App de estudio con repaso espaciado, mapas mentales, quizzes, exámenes y sesiones con pausas basadas en neurociencia.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23846044'/%3E%3Ccircle cx='10' cy='11' r='4' fill='%23DFCCB1'/%3E%3Ccircle cx='22' cy='9' r='3' fill='%23C4A071'/%3E%3Ccircle cx='21' cy='22' r='4.5' fill='%2398A086'/%3E%3Ccircle cx='9' cy='22' r='2.5' fill='%23A76D5E'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="icon-192.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=JetBrains+Mono:wght@400;600&family=Noto+Sans:wght@400;700&family=Noto+Serif:wght@500;700&display=swap">
<style>
/* Layout: app shell — left rail on desktop, bottom tab bar on phone; one working column per view. */
:root{
  /* paleta: salvia 98A086 · rosa empolvado A76D5E · tostado dorado C4A071 · beige cálido DFCCB1 · marrón terracota 846044 */
  --bg:#F4EDE1; --surface:#FBF7F0; --surface-2:#EDE2D0; --ink:#3A2A1E; --muted:#7A6553; --line:#DFCCB1;
  --accent:#846044; --accent-soft:#EFE3D2; --accent-ink:#FBF7F0; --spark:#C4A071; --spark-ink:#8A6A35; --spark-soft:#F3E6CF;
  --ok:#66704F; --ok-fill:#98A086; --ok-soft:#E5E8D9; --warn:#93702F; --bad:#9C5E4F; --bad-soft:#F3E0D8;
  --b1:#846044; --b2:#7D8868; --b3:#A76D5E; --b4:#B08A52; --b5:#6E7A5C; --b6:#8C5A4C;
  --f-display:"Fraunces","Noto Serif",ui-serif,Georgia,"Times New Roman",serif;
  --f-body:"Atkinson Hyperlegible","Noto Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:12px; --shadow:0 1px 2px rgba(58,42,30,.06),0 8px 24px rgba(58,42,30,.07);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1D1713; --surface:#27201A; --surface-2:#332A22; --ink:#F0E6D7; --muted:#B7A48E; --line:#45392D;
  --accent:#C4A071; --accent-soft:#3A2F22; --accent-ink:#1D1713; --spark:#C4A071; --spark-ink:#DDBD89; --spark-soft:#3A2E1D;
  --ok:#AEB89A; --ok-fill:#98A086; --ok-soft:#2B3024; --warn:#D9B26E; --bad:#D59A8C; --bad-soft:#3A2420;
  --b1:#C4A071; --b2:#A9B394; --b3:#D3958A; --b4:#DFCCB1; --b5:#98A086; --b6:#C99A86;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1D1713; --surface:#27201A; --surface-2:#332A22; --ink:#F0E6D7; --muted:#B7A48E; --line:#45392D;
  --accent:#C4A071; --accent-soft:#3A2F22; --accent-ink:#1D1713; --spark:#C4A071; --spark-ink:#DDBD89; --spark-soft:#3A2E1D;
  --ok:#AEB89A; --ok-fill:#98A086; --ok-soft:#2B3024; --warn:#D9B26E; --bad:#D59A8C; --bad-soft:#3A2420;
  --b1:#C4A071; --b2:#A9B394; --b3:#D3958A; --b4:#DFCCB1; --b5:#98A086; --b6:#C99A86;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
html{font-size:106.25%}
html[data-size="l"]{font-size:118.75%}
html[data-size="xl"]{font-size:131.25%}
html[data-font="lexend"]{--f-body:"Lexend","Noto Sans",ui-sans-serif,system-ui,sans-serif}
html[data-font="sistema"]{--f-body:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif}
body{background:var(--bg);color:var(--ink);font:1rem/1.6 var(--f-body);-webkit-font-smoothing:antialiased;text-align:left;hyphens:manual}
html[data-spacing="amplio"] body{letter-spacing:.05em;word-spacing:.16em}
html[data-spacing="amplio"] .prose,html[data-spacing="amplio"] .flash{line-height:1.85}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(1.8rem,4vw,2.5rem);font-weight:700}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.label{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}

/* shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding:22px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px;background:var(--surface)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.mark{width:30px;height:30px;flex:none}
.brand b{font-family:var(--f-display);font-weight:700;font-size:1.3rem;letter-spacing:-.01em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--muted);font-weight:700}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav svg{width:20px;height:20px;flex:none}
.nav .count{margin-left:auto;font-family:var(--f-mono);font-size:.75rem;background:var(--spark);color:#2A1E12;border-radius:99px;padding:1px 7px}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.timer-mini{display:none;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;background:var(--surface-2);font-family:var(--f-mono);font-size:.85rem;cursor:pointer;border:0}
.timer-mini.on{display:flex}
.timer-mini i{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.timer-mini.brk i{background:var(--ok-fill)}
main{min-width:0;padding-block:28px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.topbar{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);cursor:pointer;font-weight:700;font-size:.9rem}
.chip .av{width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.75rem}
.mobile-top{display:none!important}
#view{display:flex;flex-direction:column;gap:22px;min-width:0}
.shell{background:linear-gradient(to right,var(--surface) 231px,var(--line) 231px,var(--line) 232px,var(--bg) 232px)}

/* bottom tabs */
.tabs{display:none}
@media (max-width:760px){
  .shell{grid-template-columns:1fr}
  .rail{display:none}
  .mobile-top{display:flex!important;align-items:center;gap:10px}
  .shell{background:var(--bg)}
  .mobile-top b{font-family:var(--f-display);font-weight:700;font-size:1.25rem}
  main{padding-block:18px calc(92px + env(safe-area-inset-bottom,0px))}
  .tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .tabs button{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:10px;font-size:.7rem;font-weight:700;color:var(--muted);position:relative}
  .tabs button[aria-current="page"]{color:var(--accent)}
  .tabs svg{width:22px;height:22px}
  .tabs .count{position:absolute;top:0;right:calc(50% - 22px);font-family:var(--f-mono);font-size:.62rem;background:var(--spark);color:#2A1E12;border-radius:99px;padding:0 5px}
}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.lift{box-shadow:var(--shadow);border-color:transparent}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.min0{min-width:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer;line-height:1.2;text-align:center}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:.86rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px}

input[type=text],input[type=date],input[type=number],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
textarea{resize:vertical;min-height:140px;line-height:1.55}
.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-weight:700;font-size:.9rem}

/* stats */
.stat{display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.stat .v{font-family:var(--f-display);font-weight:700;font-size:1.9rem;font-variant-numeric:tabular-nums;line-height:1}
.stat .v small{font-size:.9rem;font-weight:500;color:var(--muted)}
.stat.hot{background:var(--spark-soft);border-color:transparent}
.stat.hot .v{color:var(--spark-ink)}

.next{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:20px 22px}
.next h2{font-size:1.25rem}
.next p{opacity:.88}
.next .btn{background:var(--accent-ink);color:var(--accent);border-color:transparent}
.next .glyph{width:46px;height:46px;border-radius:12px;background:color-mix(in srgb,var(--accent-ink) 18%,transparent);display:grid;place-items:center}
@media (max-width:560px){.next{grid-template-columns:1fr}.next .glyph{display:none}}

.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:120px}
.bars div{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars i{display:block;width:100%;max-width:34px;border-radius:6px 6px 2px 2px;background:var(--accent);min-height:3px}
.bars i.zero{background:var(--surface-2)}
.bars span{font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}

/* notes */
.note-card{display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;transition:border-color .15s}
.note-card:hover{border-color:var(--accent)}
.note-card h3{overflow-wrap:anywhere}
.note-card p{color:var(--muted);font-size:.9rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.tag.ex{background:var(--spark-soft);color:var(--spark-ink)}
.tag.due{background:var(--accent-soft);color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}

.tooltabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.tooltabs button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-weight:700;cursor:pointer;font-size:.9rem;display:flex;gap:6px;align-items:center}
.tooltabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tooltabs button .ok{width:6px;height:6px;border-radius:50%;background:var(--ok)}

.prose{max-width:66ch;line-height:1.7}
.prose h1,.prose h2,.prose h3{margin:1.1em 0 .4em}
.prose h1:first-child,.prose h2:first-child,.prose h3:first-child{margin-top:0}
.prose p{margin:.6em 0}
.prose ul,.prose ol{margin:.4em 0;padding-left:1.3em}
.prose li{margin:.2em 0}
.prose code{font-family:var(--f-mono);font-size:.88em;background:var(--surface-2);padding:1px 5px;border-radius:5px}
.prose strong{color:var(--ink)}
.prose blockquote{margin:.8em 0;padding:8px 14px;border-left:3px solid var(--spark);background:var(--spark-soft);border-radius:0 8px 8px 0}
.raw{white-space:pre-wrap;overflow-wrap:anywhere}

.thinking{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:700}
.pulse{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.notice{padding:12px 14px;border-radius:10px;background:var(--surface-2);font-size:.92rem}
.notice.warn{background:var(--spark-soft)}
.notice.err{background:var(--bad-soft);color:var(--bad)}

/* flashcard */
.flash{min-height:260px;display:flex;flex-direction:column;justify-content:center;gap:16px;text-align:center;padding:28px 22px;border-radius:18px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.flash .q{font-family:var(--f-body);font-weight:700;line-height:1.45;font-size:clamp(1.25rem,3vw,1.6rem);overflow-wrap:anywhere;white-space:pre-wrap}
.flash .a{font-size:1.2rem;line-height:1.55;border-top:1px dashed var(--line);padding-top:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700}
.rate button small{font-family:var(--f-mono);font-weight:400;color:var(--muted);font-size:.75rem}
.rate .r1{border-color:var(--bad);color:var(--bad)}
.rate .r2{border-color:var(--warn);color:var(--warn)}
.rate .r3{border-color:var(--ok);color:var(--ok)}
.rate .r4{border-color:var(--accent);color:var(--accent)}
.progress{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}

/* quiz */
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{font-family:var(--f-mono);font-weight:600;color:var(--muted);flex:none}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}

/* timer */
.timer{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:820px){.timer{grid-template-columns:1fr}}
.ring{position:relative;width:min(300px,78vw);aspect-ratio:1;margin:0 auto;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center}
.ring .time{font-family:var(--f-mono);font-weight:600;font-size:clamp(2.4rem,9vw,3.4rem);letter-spacing:-.03em}
.phase-pill{font-family:var(--f-mono);font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.phase-pill.brk{background:var(--ok-soft);color:var(--ok)}
.blocks{display:flex;gap:6px;justify-content:center}
.blocks i{width:26px;height:8px;border-radius:99px;background:var(--surface-2)}
.blocks i.done{background:var(--accent)}
.blocks i.now{background:var(--spark)}
.preset{display:flex;flex-direction:column;gap:2px;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.preset[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.preset b{font-family:var(--f-mono)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:8px 12px;font-weight:700;cursor:pointer;font-size:.88rem}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* science */
.sci{display:grid;grid-template-columns:52px minmax(0,1fr);gap:16px;padding:18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.sci .n{font-family:var(--f-display);font-weight:700;font-style:italic;font-size:1.6rem;color:var(--accent)}
.sci .app{margin-top:8px;font-size:.92rem;padding:8px 12px;border-radius:8px;background:var(--accent-soft)}
.sci .src{margin-top:8px;font-size:.82rem}
.evid{display:inline-block;font-family:var(--f-mono);font-size:.68rem;padding:2px 8px;border-radius:99px;margin-left:6px;vertical-align:middle;letter-spacing:.04em}
.evid.alta{background:var(--ok-soft);color:var(--ok)}
.evid.media{background:var(--spark-soft);color:var(--spark-ink)}
.evid.baja{background:var(--bad-soft);color:var(--bad)}

/* mindmap */
.mapbox{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);max-height:72vh}
.mapbox svg{display:block}
.mapbox text{font-family:var(--f-body);font-size:13px;fill:var(--ink)}
.mapbox .n0 text{font-family:var(--f-display);font-weight:700;font-size:16px;fill:var(--accent-ink)}
.mapbox .hid{cursor:pointer}
.mapbox .hid text{fill:var(--muted);font-family:var(--f-mono)}

/* chat */
.chat{display:flex;flex-direction:column;gap:10px;max-height:56vh;overflow:auto;padding:4px}
.msg{max-width:85%;padding:10px 14px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:4px}

/* audio */
.seglist{display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow:auto}
.seglist p{padding:6px 10px;border-radius:8px}
.seglist p.on{background:var(--accent-soft)}
.seglist p.q{font-weight:700;color:var(--spark-ink)}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(30,22,16,.55);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.modal .box{width:min(720px,100%);background:var(--bg);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.drop{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted);cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}

/* ============ utilidades ============ */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const DAY=86400000;
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const dkey=t=>{const d=new Date(t);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* markdown mínimo y seguro */
function md(src){
  const inline=s=>s.replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<em>$2</em>");
  const lines=esc(src||"").split(/\r?\n/);let out="",stack=[],para=[];
  const flushP=()=>{if(para.length){out+="<p>"+inline(para.join(" "))+"</p>";para=[]}};
  const closeTo=lvl=>{while(stack.length>lvl){out+="</li></"+stack.pop().t+">"}};
  for(const raw of lines){
    const m=raw.match(/^(\s*)([-*•]|\d+[.)])\s+(.*)$/);
    if(m){flushP();const lvl=Math.floor(m[1].replace(/\t/g,"  ").length/2)+1;const t=/\d/.test(m[2])?"ol":"ul";
      if(stack.length<lvl){while(stack.length<lvl){out+="<"+t+"><li>";stack.push({t})}}
      else{closeTo(lvl);out+="</li><li>"}
      out+=inline(m[3]);continue}
    const hm=raw.match(/^(#{1,4})\s+(.*)$/);
    if(hm){flushP();closeTo(0);const n=Math.min(3,hm[1].length+1);out+=`<h${n}>${inline(hm[2])}</h${n}>`;continue}
    const bq=raw.match(/^&gt;\s?(.*)$/);
    if(bq){flushP();closeTo(0);out+="<blockquote>"+inline(bq[1])+"</blockquote>";continue}
    if(!raw.trim()){flushP();closeTo(0);continue}
    if(stack.length){out+=" "+inline(raw.trim());continue}
    para.push(raw.trim());
  }
  flushP();closeTo(0);return out;
}

/* ============ ejemplo ============ */
const EX_TEXT=`La fotosíntesis es el proceso por el que los organismos fotoautótrofos (plantas, algas y cianobacterias) transforman la energía luminosa en energía química. Ocurre en los cloroplastos y tiene dos fases.

Fase luminosa (en las membranas de los tilacoides): los pigmentos fotosintéticos, sobre todo la clorofila, captan la luz en los fotosistemas I y II. La fotólisis del agua libera electrones, protones y oxígeno (O2), que se expulsa a la atmósfera. El transporte de electrones genera un gradiente de protones que la ATP sintasa aprovecha para fabricar ATP (fotofosforilación). Al final de la cadena se reduce NADP+ a NADPH.

Fase oscura o ciclo de Calvin (en el estroma): no necesita luz directamente, pero sí el ATP y el NADPH de la fase luminosa. La enzima RuBisCO fija el CO2 a la ribulosa-1,5-bisfosfato. Tras la reducción se obtiene gliceraldehído-3-fosfato (G3P), con el que se sintetizan glucosa y otras moléculas orgánicas. La RuBP se regenera para seguir el ciclo.

Factores que influyen: intensidad luminosa, concentración de CO2, temperatura y disponibilidad de agua. La fotorrespiración ocurre cuando la RuBisCO fija O2 en lugar de CO2 y reduce el rendimiento; las plantas C4 y CAM tienen adaptaciones que la minimizan.

Ecuación global: 6 CO2 + 6 H2O + luz → C6H12O6 + 6 O2.`;
function exampleBundle(pid){
  const id="ej-"+pid;
  return {
    note:{id,pid,title:"La fotosíntesis",subject:"Biología",text:EX_TEXT,created:Date.now(),updated:Date.now(),example:true},
    outs:{id,
      summary:`## Idea central\nLa fotosíntesis convierte **energía luminosa en energía química** dentro del cloroplasto, en dos fases encadenadas.\n\n## Fase luminosa · tilacoides\n- La clorofila capta luz en los **fotosistemas I y II**.\n- **Fotólisis del agua**: libera e⁻, H⁺ y **O₂**.\n- El gradiente de protones mueve la **ATP sintasa** → ATP.\n- Se reduce **NADP⁺ → NADPH**.\n\n## Ciclo de Calvin · estroma\n- Usa el ATP y el NADPH de la fase luminosa.\n- La **RuBisCO** fija CO₂ a la RuBP.\n- Se obtiene **G3P** → glucosa; la RuBP se regenera.\n\n## Factores y límites\n- Luz, CO₂, temperatura y agua.\n- **Fotorrespiración**: la RuBisCO fija O₂; C4 y CAM la reducen.\n\n> Antes de seguir, tapa esto y responde: ¿de dónde sale el O₂ que liberan las plantas? ¿Qué dos moléculas conectan las dos fases?`,
      outline:`1. Definición y localización\n  - Organismos fotoautótrofos\n  - Cloroplasto\n2. Fase luminosa (tilacoides)\n  - Captación de luz: fotosistemas I y II\n  - Fotólisis del agua → O₂\n  - Fotofosforilación → ATP\n  - Reducción de NADP⁺ → NADPH\n3. Ciclo de Calvin (estroma)\n  - Fijación del CO₂ por la RuBisCO\n  - Reducción → G3P\n  - Regeneración de la RuBP\n4. Factores limitantes\n  - Luz, CO₂, temperatura, agua\n  - Fotorrespiración; plantas C4 y CAM\n5. Ecuación global`,
      mindmap:{centro:"Fotosíntesis",ramas:[
        {t:"Fase luminosa",h:[{t:"Tilacoides"},{t:"Fotosistemas I y II"},{t:"Fotólisis del agua",h:[{t:"Libera O₂"}]},{t:"Produce ATP y NADPH"}]},
        {t:"Ciclo de Calvin",h:[{t:"Estroma"},{t:"RuBisCO fija CO₂"},{t:"G3P → glucosa"},{t:"Regenera RuBP"}]},
        {t:"Factores",h:[{t:"Luz"},{t:"CO₂"},{t:"Temperatura"},{t:"Agua"}]},
        {t:"Fotorrespiración",h:[{t:"RuBisCO fija O₂"},{t:"Plantas C4 y CAM"}]},
        {t:"Ecuación",h:[{t:"6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂"}]}
      ]},
      quiz:[
        {p:"¿De qué molécula procede el O₂ liberado en la fotosíntesis?",o:["Del CO₂","Del agua","De la glucosa","Del NADPH"],c:1,e:"Lo libera la fotólisis del agua en la fase luminosa. Es un error frecuente pensar que sale del CO₂."},
        {p:"¿Dónde ocurre el ciclo de Calvin?",o:["En los tilacoides","En la mitocondria","En el estroma del cloroplasto","En el citoplasma"],c:2,e:"El ciclo de Calvin sucede en el estroma; la fase luminosa, en las membranas de los tilacoides."},
        {p:"¿Qué aporta la fase luminosa al ciclo de Calvin?",o:["Glucosa y O₂","ATP y NADPH","CO₂ y agua","RuBisCO"],c:1,e:"ATP y NADPH son la energía y el poder reductor que el ciclo necesita para fijar y reducir el CO₂."},
        {p:"Si una planta cierra sus estomas en un día muy caluroso, ¿qué es más probable?",o:["Aumenta la fotorrespiración","Se detiene la fotólisis","Sube el CO₂ interno","Deja de haber luz útil"],c:0,e:"Al cerrar estomas baja el CO₂ y sube el O₂ interno, y la RuBisCO fija más O₂: fotorrespiración. Las plantas C4 y CAM lo evitan."},
        {p:"¿Qué enzima fija el CO₂ en el ciclo de Calvin?",o:["ATP sintasa","RuBisCO","Clorofila","Fotosistema II"],c:1,e:"La RuBisCO une el CO₂ a la ribulosa-1,5-bisfosfato."}
      ],
      audio:`Vamos a entender la fotosíntesis como si fuera una fábrica con dos naves.\n[PAUSA]\nEn la primera nave, la fase luminosa, la luz es la fuente de energía. Ocurre en los tilacoides. La clorofila capta la luz y rompe moléculas de agua. Al romperlas se libera oxígeno, que es el que respiramos.\nPREGUNTA: Entonces, ¿de dónde sale el oxígeno que liberan las plantas?\nDel agua. No del dióxido de carbono.\n[PAUSA]\nEsa primera nave fabrica dos productos: ATP, que es energía, y NADPH, que aporta electrones. Ninguno sale de la fábrica: se envían a la segunda nave.\nLa segunda nave es el ciclo de Calvin, en el estroma. Allí la enzima RuBisCO captura el dióxido de carbono del aire y, con el ATP y el NADPH, lo convierte en azúcar.\nPREGUNTA: ¿Qué dos moléculas conectan las dos fases?\nATP y NADPH.\n[PAUSA]\nUna última idea. Cuando hace mucho calor la planta cierra sus estomas para no perder agua, y la RuBisCO se equivoca y fija oxígeno. Eso es la fotorrespiración, y las plantas C4 y CAM tienen trucos para evitarla.`
    },
    deck:{id,cards:[
      {id:"e1",f:"¿En qué orgánulo ocurre la fotosíntesis?",b:"En el cloroplasto."},
      {id:"e2",f:"La fase luminosa ocurre en ___.",b:"Las membranas de los tilacoides."},
      {id:"e3",f:"¿Qué proceso libera el O₂ en la fotosíntesis?",b:"La fotólisis del agua."},
      {id:"e4",f:"¿Qué dos productos de la fase luminosa usa el ciclo de Calvin?",b:"ATP y NADPH."},
      {id:"e5",f:"¿Qué enzima fija el CO₂ a la RuBP?",b:"La RuBisCO."},
      {id:"e6",f:"¿Dónde ocurre el ciclo de Calvin?",b:"En el estroma del cloroplasto."},
      {id:"e7",f:"¿Qué es la fotorrespiración?",b:"La fijación de O₂ en lugar de CO₂ por la RuBisCO; reduce el rendimiento."},
      {id:"e8",f:"Ecuación global de la fotosíntesis",b:"6 CO₂ + 6 H₂O + luz → C₆H₁₂O₆ + 6 O₂"}
    ]}
  };
}

/* ============ estado y almacenamiento ============ */
const state={profiles:[],pid:null,notes:{},outs:{},decks:{},metas:{},ready:false};
const ui={errLocal:{},kbd:"auto",typed:false,strict:true,view:"hoy",noteId:null,tool:"texto",busy:{},quiz:null,exam:null,review:null,recall:false,revealed:new Set(),chat:{},fey:{},err:{},dump:null};
const IDB={db:null,
  open(){return new Promise((res,rej)=>{if(!("indexedDB" in window))return rej("no");let r;try{r=indexedDB.open("memoriaviva",1)}catch(e){return rej(e)}r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  st(mode){return this.db.transaction("kv",mode).objectStore("kv")},
  all(){return new Promise((res,rej)=>{const out={};const rq=this.st("readonly").openCursor();rq.onsuccess=()=>{const c=rq.result;if(c){out[c.key]=c.value;c.continue()}else res(out)};rq.onerror=()=>rej(rq.error)})},
  put(k,v){return new Promise((res,rej)=>{const rq=this.st("readwrite").put(v,k);rq.onsuccess=()=>res();rq.onerror=()=>rej(rq.error)})},
  del(k){return new Promise((res,rej)=>{const rq=this.st("readwrite").delete(k);rq.onsuccess=()=>res();rq.onerror=()=>rej(rq.error)})}
};
const Store={
  mode:"memoria",map:{},ready:false,pending:[],lsTimer:null,
  async init(){
    try{
      await IDB.open();this.map=await IDB.all();this.mode="dispositivo";
      const old=lsGet("memoriaviva_v1");
      if(old&&!Object.keys(this.map).length){try{const m=JSON.parse(old)||{};for(const [k,v] of Object.entries(m)){this.map[k]=v;await IDB.put(k,v)}}catch{}}
      try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch{}
      return;
    }catch{}
    const raw=lsGet("memoriaviva_v1");
    if(raw!==null){try{this.map=JSON.parse(raw)||{}}catch{this.map={}}this.mode="navegador"}
    else if(lsSet("mv_probe","1"))this.mode="navegador";
  },
  async finish(){this.ready=true;const p=this.pending;this.pending=[];for(const [op,k,v] of p){op==="s"?this.save(k,v):this.del(k)}},
  save(key,obj){
    const clean=JSON.parse(JSON.stringify(obj));
    if(!this.ready){this.pending.push(["s",key,clean]);return}
    this.map[key]=clean;
    if(this.mode==="dispositivo")IDB.put(key,clean).catch(e=>toast(e&&e.name==="QuotaExceededError"?"El almacenamiento está lleno. Borra apuntes antiguos para seguir guardando.":"No se pudo guardar el cambio."));
    else if(this.mode==="navegador")this.flushLocal();
  },
  del(key){
    if(!this.ready){this.pending.push(["d",key]);return}
    delete this.map[key];
    if(this.mode==="dispositivo")IDB.del(key).catch(()=>{});
    else if(this.mode==="navegador")this.flushLocal();
  },
  flushLocal(){clearTimeout(this.lsTimer);this.lsTimer=setTimeout(()=>{if(!lsSet("memoriaviva_v1",JSON.stringify(this.map))){this.mode="memoria";toast("El navegador no deja guardar más. Descarga una copia en Ajustes.")}},300)}
};
function hydrate(){
  const m=Store.map;
  const pdoc=m.profiles;
  state.profiles=pdoc&&pdoc.list&&pdoc.list.length?pdoc.list:[{id:"p1",name:"Estudiante",level:"Bachillerato"}];
  state.pid=pdoc&&pdoc.active&&state.profiles.some(p=>p.id===pdoc.active)?pdoc.active:state.profiles[0].id;
  for(const [k,v] of Object.entries(m)){
    if(k.startsWith("n_"))state.notes[v.id]=v;
    else if(k.startsWith("o_"))state.outs[v.id]=v;
    else if(k.startsWith("d_"))state.decks[v.id]=v;
    else if(k.startsWith("m_"))state.metas[k.slice(2)]=v;
  }
  state.profiles.forEach(p=>ensureExample(p.id));
}
function ensureExample(pid){
  const meta=getMeta(pid);
  if(meta.hideExample)return;
  const b=exampleBundle(pid);
  if(!state.notes[b.note.id])state.notes[b.note.id]=b.note;
  if(!state.outs[b.note.id])state.outs[b.note.id]=b.outs;
  if(!state.decks[b.note.id])state.decks[b.note.id]=b.deck;
}
const prof=()=>state.profiles.find(p=>p.id===state.pid)||state.profiles[0];
function getMeta(pid=state.pid){if(!state.metas[pid])state.metas[pid]={days:[],reviews:{},focus:{},exams:[],hideExample:false,rate:1,voice:""};return state.metas[pid]}
const saveMeta=()=>Store.save("m_"+state.pid,getMeta());
const saveProfiles=()=>Store.save("profiles",{list:state.profiles,active:state.pid});

const PPB={"ESO":6,"Bachillerato":4,"EBAU / Selectividad":4,"Universidad":3,"FP":5,"Oposiciones":3};
const KF={nada:1,algo:0.65,bastante:0.35};
function capMin(date){const m=getMeta();const dl=m.daily||{wd:90,we:120};const g=new Date(date+"T12:00").getDay();return (g===0||g===6)?dl.we:dl.wd}
function needBlocks(pages,level){return Math.max(1,Math.ceil((Number(pages)||4)/(PPB[prof().level]||4)*(KF[level]||1)))}
function revDates(t,e){if(!t.learnedOn)return[];const b=new Date(t.learnedOn+"T12:00").getTime();const ds=[1,3,7,14].map(k=>dkey(b+k*DAY)).filter(d=>d<e.date);const last=dkey(new Date(e.date+"T12:00").getTime()-DAY);if(last>t.learnedOn&&!ds.includes(last))ds.push(last);return [...new Set(ds)].sort()}
function buildPlan(maxDays=70){
  const m=getMeta();const t0=today();
  const exams=m.exams.filter(e=>e.temas&&e.date>t0).map(e=>JSON.parse(JSON.stringify(e)));
  const days=[];const warn=[];if(!exams.length)return{days,warn,exams};
  const lastD=Math.min(maxDays,Math.max(...exams.map(e=>daysUntil(e.date))));
  const doneMin=(m.doneLog&&m.doneLog[t0]||[]).reduce((a,x)=>a+(x.min||0),0);
  for(let d=0;d<lastD;d++){
    const date=dkey(Date.now()+d*DAY);let left=capMin(date)-(d===0?doneMin:0);const tasks=[];
    const live=exams.filter(e=>e.date>date);
    for(const e of live)for(const t of e.temas){const ds=revDates(t,e);const nx=ds[t.revs.length];if(nx&&nx<=date){tasks.push({k:"rev",e:e.id,t:t.id,min:15,sub:e.subject,name:t.name,late:nx<date});t.revs.push(date);left-=15}}
    for(const e of live){const dl=daysUntil(e.date)-d;if(!e.sim&&dl===Math.min(2,Math.max(1,daysUntil(e.date)-1))&&e.temas.every(t=>t.learnedOn)){tasks.push({k:"sim",e:e.id,min:60,sub:e.subject});e.sim=true;left-=60}}
    const per={};
    while(left>=25){
      const cands=live.filter(e=>e.temas.some(t=>!t.learnedOn));if(!cands.length)break;
      const scored=cands.map(e=>{const rem=e.temas.reduce((a,t)=>a+(t.learnedOn?0:t.need-t.done),0);const soft=Math.max(1,daysUntil(e.date)-d-Math.max(1,Math.round(daysUntil(e.date)*0.2)));return{e,rem,pr:rem/soft}}).sort((a,b)=>b.pr-a.pr);
      let pick=scored[0];
      const total=Object.values(per).reduce((a,b)=>a+b,0)+1;
      if(scored.length>1&&(per[pick.e.id]||0)+1>Math.ceil(total*0.6)&&total>1)pick=scored[1];
      const t=pick.e.temas.find(x=>!x.learnedOn);t.done++;per[pick.e.id]=(per[pick.e.id]||0)+1;left-=30;
      const prev=tasks.find(x=>x.k==="learn"&&x.t===t.id);
      if(prev){prev.min+=30;prev.n++}else tasks.push({k:"learn",e:pick.e.id,t:t.id,min:30,n:1,sub:pick.e.subject,name:t.name,first:t.done===1});
      if(t.done>=t.need)t.learnedOn=date;
    }
    days.push({date,tasks});
  }
  for(const e of exams){const rem=e.temas.reduce((a,t)=>a+(t.learnedOn?0:t.need-t.done),0);if(rem>0)warn.push(`${e.subject}: faltan unos ${rem} bloques de 30 min (≈${Math.round(rem/2)} h) para estudiar todo antes del ${fmtDate(e.date)}. Amplía el tiempo diario o empieza por los temas que más pesan.`)}
  return{days,warn,exams};
}
function taskInfo(x){
  if(x.k==="learn")return{t:`Estudiar «${x.name}»`,h:x.first?"Primera pasada: entiende, crea tarjetas y termina con 2 minutos de recuerdo libre.":"Continúa el tema y termina recuperando sin mirar lo que acabas de ver.",ic:"apuntes"};
  if(x.k==="rev")return{t:`Repasar «${x.name}»`,h:(x.late?"Pendiente de días anteriores. ":"")+"Sin mirar primero: tarjetas, quiz o explicarlo en voz alta. Luego corrige con los apuntes.",ic:"repasar"};
  return{t:"Simulacro de examen",h:"Examen completo, con tiempo y sin apuntes. Después repasa solo lo que fallaste.",ic:"sesion"};
}
function strategyText(exams){
  if(exams.length<2)return "";
  const ds=exams.map(e=>e.date).sort();const close=ds.some((x,i)=>i&&daysUntil(x)-daysUntil(ds[i-1])<=14);
  return close?"Preparas tus exámenes a la vez: cada día se reparten bloques entre asignaturas, con prioridad para la más cercana o la que más materia tiene. Alternar materias espacia el estudio y obliga a recuperar cada tema varias veces.":"Tus exámenes están separados: el plan se centra en el más cercano y avanza poco a poco el siguiente para que no llegue de golpe.";
}
function planToday(){
  const P=buildPlan();const m=getMeta();const t0=today();
  const doneT=(m.doneLog&&m.doneLog[t0])||[];
  if(!P.exams.length)return "";
  const tday=P.days[0]?P.days[0].tasks:[];const mins=tday.reduce((a,x)=>a+x.min,0);
  const upcoming=P.days.slice(1,8).filter(d=>d.tasks.length);
  return `<section class="card stack"><div class="row between"><h2>Plan de hoy</h2><span class="label">${mins} min previstos</span></div>
  ${strategyText(P.exams)?`<p class="small muted">${esc(strategyText(P.exams))}</p>`:""}
  ${P.warn.map(w=>`<div class="notice warn small">${esc(w)}</div>`).join("")}
  ${tday.length?`<div class="stack" style="gap:8px">${tday.map(x=>{const i=taskInfo(x);return `<div class="row between" style="flex-wrap:nowrap;align-items:flex-start;gap:12px;padding:10px 0;border-top:1px solid var(--line)"><div class="stack min0" style="gap:2px"><div class="row" style="gap:8px"><span class="tag"><i class="dot" style="background:${subjColor(x.sub)}"></i>${esc(x.sub)}</span><b>${esc(i.t)}</b>${x.n>1?`<span class="mono small muted">${x.n} bloques</span>`:""}</div><span class="small muted">${esc(i.h)}</span></div><button class="btn sm" data-act="taskdone" data-k="${x.k}" data-e="${x.e}" data-t="${x.t||""}" data-min="${x.k==="learn"?30:x.min}">${x.k==="learn"?"Bloque hecho":"Hecho"}</button></div>`}).join("")}</div>`:`<p class="muted">Hoy no hay nada planificado${doneT.length?": ya has hecho lo de hoy. Descansa y duerme bien.":"."}</p>`}
  ${doneT.length?`<p class="small muted">Hecho hoy: ${doneT.map(x=>esc(x.label)).join(" · ")}</p>`:""}
  ${upcoming.length?`<details><summary class="small" style="cursor:pointer;font-weight:700">Próximos días</summary><div class="stack" style="gap:6px;margin-top:8px">${upcoming.map(d=>`<div class="row small" style="gap:6px;align-items:baseline"><b style="min-width:92px">${esc(fmtDate(d.date))}</b>${d.tasks.map(x=>`<span class="tag"><i class="dot" style="background:${subjColor(x.sub)}"></i>${x.k==="learn"?"Estudiar":x.k==="rev"?"Repasar":"Simulacro"}${x.name?" "+esc(short(x.name,3)):""}</span>`).join("")}</div>`).join("")}</div></details>`:""}
  </section>`;
}
function markTask(k,eid,tid,min){
  const m=getMeta();const e=m.exams.find(x=>x.id===eid);if(!e)return;const t=e.temas&&e.temas.find(x=>x.id===tid);const t0=today();
  let label="";
  if(k==="learn"&&t){t.done=Math.min(t.need,(t.done||0)+1);if(t.done>=t.need&&!t.learnedOn)t.learnedOn=t0;label="Estudiar "+t.name}
  else if(k==="rev"&&t){t.revs.push(t0);label="Repaso "+t.name}
  else if(k==="sim"){e.sim=true;label="Simulacro "+e.subject}
  m.doneLog=m.doneLog||{};Object.keys(m.doneLog).forEach(d=>{if(d<dkey(Date.now()-14*DAY))delete m.doneLog[d]});
  (m.doneLog[t0]=m.doneLog[t0]||[]).push({label,min:Number(min)||30});
  markActive();saveMeta();render();toast("Anotado");
}

function examRow(e){
  if(e.temas){const D=daysUntil(e.date);const learned=e.temas.filter(t=>t.learnedOn).length;const pct=Math.round(e.temas.reduce((a,t)=>a+(t.learnedOn?t.need:t.done),0)/Math.max(1,e.temas.reduce((a,t)=>a+t.need,0))*100);
    return `<div class="stack" style="gap:6px;padding:10px 0;border-top:1px solid var(--line)">
    <div class="row between"><b>${esc(e.subject)}</b><span class="mono small" style="${D<=3?"color:var(--bad)":""}">${D===0?"¡Hoy!":D===1?"mañana":"en "+D+" días"}</span></div>
    <div class="small muted">${esc(fmtDate(e.date))} · ${e.temas.length} temas · ${learned} estudiados</div>
    <div class="progress"><i style="width:${pct}%"></i></div>
    <div class="row">${ui.confirmExam===e.id?`<span class="small">¿Quitar el examen y su plan?</span><button class="btn sm danger" data-act="delexam" data-id="${e.id}">Quitar</button><button class="btn ghost sm" data-act="canceldelexam">Cancelar</button>`:`<button class="btn ghost sm" data-act="askdelexam" data-id="${e.id}">Quitar</button>`}</div></div>`}
  const D=daysUntil(e.date);const plan=examPlan(e);const t=today();
  const nextRev=plan.find(d=>d>=t);
  return `<div class="stack" style="gap:6px;padding:10px 0;border-top:1px solid var(--line)">
    <div class="row between"><b>${esc(e.subject)}</b><span class="mono small ${D<=3?"":"muted"}" style="${D<=3?"color:var(--bad)":""}">${D===0?"¡Hoy!":D===1?"mañana":"en "+D+" días"}</span></div>
    <div class="small muted">${esc(fmtDate(e.date))}${nextRev?` · próximo repaso: <b style="color:var(--ink)">${nextRev===t?"hoy":esc(fmtDate(nextRev))}</b>`:""}</div>
    ${plan.length?`<div class="row" style="gap:6px">${plan.map(d=>`<span class="tag ${d===t?"due":""}">${esc(fmtDate(d))}</span>`).join("")}</div>`:""}
    <div><button class="btn ghost sm" data-act="delexam" data-id="${e.id}">Quitar</button></div></div>`;
}
function noteCard(n){
  const d=state.decks[n.id];const nc=d?d.cards.length:0;const due=d?d.cards.filter(c=>c.due!==undefined&&c.due<=Date.now()).length:0;
  return `<button class="note-card" data-act="open" data-id="${n.id}">
    <div class="row between" style="width:100%"><span class="tag"><i class="dot" style="background:${subjColor(n.subject)}"></i>${esc(n.subject||"Sin asignatura")}</span>${n.example?`<span class="tag ex">Ejemplo</span>`:""}</div>

    <div class="row small muted"><span class="mono">${nc} tarjetas</span>${due?`<span class="tag due">${due} para hoy</span>`:""}</div></button>`;

function subjColor(s){const pal=["var(--b1)","var(--b2)","var(--b3)","var(--b4)","var(--b5)","var(--b6)"];let h=0;for(const c of String(s||""))h=(h*31+c.charCodeAt(0))>>>0;return pal[h%pal.length]}

function vApuntes(){
  const notes=myNotes();const subs=[...new Set(notes.map(n=>n.subject||"Sin asignatura"))];
  const f=ui.filter||"";const list=f?notes.filter(n=>(n.subject||"Sin asignatura")===f):notes;

  ${subs.length>1?`<div class="tooltabs"><button data-act="filter" data-f="" aria-selected="${!f}">Todas</button>${subs.map(s=>`<button data-act="filter" data-f="${esc(s)}" aria-selected="${f===s}"><i class="dot" style="background:${subjColor(s)}"></i>${esc(s)}</button>`).join("")}</div>`:""}
  ${list.length?`<div class="grid g3">${list.map(noteCard).join("")}</div>`:`<div class="card empty"><h3>Sube tu primer apunte</h3><p>Pega texto, haz fotos de tu cuaderno o sube un PDF. Después la app genera esquemas, tarjetas y exámenes a partir de él.</p><button class="btn primary" data-act="newnote">${I.plus}Nuevo apunte</button></div>`}`;
}

  ${t!=="texto"&&t!=="tarjetas"?aiNotice():""}

  return `<div class="stack">
  <div class="row between"><div class="row">${o.mindmap?`<div class="seg"><button data-act="recall" data-v="0" aria-pressed="${!ui.recall}">Ver todo</button><button data-act="recall" data-v="1" aria-pressed="${ui.recall}">Modo recuerdo</button></div>`:""}</div>

  ${ui.busy[bk]?busyBox(bk,"Dibujando el mapa…"):""}${errBox(bk)}

function mindmapSVG(mm){
  const ROW=40,PADX=14,CH=7.3,GAP=46;
  const ramas=(mm.ramas||[]).slice(0,8);const right=ramas.filter((_,i)=>i%2===0),left=ramas.filter((_,i)=>i%2===1);
  const leaves=n=>n.h&&n.h.length?n.h.reduce((a,c)=>a+leaves(c),0):1;
  const w=t=>Math.min(320,String(t).length*CH+PADX*2);
  const cw=Math.max(120,w(mm.centro)+10),chh=46;
  const nodes=[],edges=[];
  function side(list,dir){
    const maxW=[0,0,0,0];
    const walk=(n,d)=>{maxW[d]=Math.max(maxW[d],w(n.t));(n.h||[]).forEach(c=>walk(c,d+1))};
    list.forEach(b=>walk(b,1));
    const colX=[0];colX[1]=cw/2+GAP;for(let d=2;d<5;d++)colX[d]=colX[d-1]+(maxW[d-1]||0)+GAP;
    const total=list.reduce((a,b)=>a+leaves(b),0)*ROW;
    return {total,place(top,cx,cy,bi0){let y=top;list.forEach((b,i)=>{const bi=bi0+i*2;placeN(b,1,y,null,bi);y+=leaves(b)*ROW});
      function placeN(nd,d,y0,parent,bi){const L=leaves(nd);const yc=y0+L*ROW/2;const ww=w(nd.t);
        const x=dir>0?cx+colX[d]:cx-colX[d]-ww;const node={t:nd.t,d,x,y:yc,w:ww,bi,dir};nodes.push(node);
        const px=parent?(dir>0?parent.x+parent.w:parent.x):(dir>0?cx+cw/2:cx-cw/2),py=parent?parent.y:cy;
        const qx=dir>0?x:x+ww;edges.push({px,py,qx,qy:yc,bi});
        let yy=y0;(nd.h||[]).forEach(c=>{placeN(c,d+1,yy,node,bi);yy+=leaves(c)*ROW})}}};
  }
  const R=side(right,1),Lf=side(left,-1);
  const H=Math.max(R.total,Lf.total,chh)+40;
  const cx=0,cy=H/2;
  R.place((H-R.total)/2,cx,cy,0);Lf.place((H-Lf.total)/2,cx,cy,1);
  let minX=-cw/2,maxX=cw/2;nodes.forEach(n=>{minX=Math.min(minX,n.x);maxX=Math.max(maxX,n.x+n.w)});
  minX-=20;maxX+=20;const W=maxX-minX;
  const colors=["var(--b1)","var(--b2)","var(--b3)","var(--b4)","var(--b5)","var(--b6)"];
  let s=`<svg width="${Math.ceil(W)}" height="${Math.ceil(H)}" viewBox="${minX} 0 ${W} ${H}" role="img" aria-label="Mapa mental: ${esc(mm.centro)}">`;
  edges.forEach(e=>{const mx=(e.px+e.qx)/2;s+=`<path d="M${e.px},${e.py} C${mx},${e.py} ${mx},${e.qy} ${e.qx},${e.qy}" fill="none" stroke="${colors[e.bi%6]}" stroke-width="2" opacity=".55"/>`});
  nodes.forEach((n,i)=>{const col=colors[n.bi%6];const hidden=ui.recall&&n.d>=2&&!ui.revealed.has(i);
    const label=hidden?"?":(String(n.t).length>44?String(n.t).slice(0,42)+"…":n.t);
    if(n.d===1)s+=`<g><rect x="${n.x}" y="${n.y-15}" width="${n.w}" height="30" rx="15" fill="${col}"/><text x="${n.x+n.w/2}" y="${n.y+4.5}" text-anchor="middle" style="fill:var(--accent-ink);font-weight:700">${esc(label)}</text></g>`;
    else s+=`<g class="${hidden?"hid":""}" ${ui.recall&&n.d>=2?`data-act="reveal" data-i="${i}" role="button" tabindex="0"`:""}><rect x="${n.x}" y="${n.y-14}" width="${hidden?Math.max(44,n.w):n.w}" height="28" rx="8" fill="var(--surface)" stroke="${col}" stroke-width="1.5" ${hidden?'stroke-dasharray="4 3"':""}/><text x="${n.x+(hidden?Math.max(44,n.w):n.w)/2}" y="${n.y+4.5}" text-anchor="middle">${esc(label)}</text><title>${hidden?"Toca para comprobar":esc(n.t)}</title></g>`});
  s+=`<g class="n0"><rect x="${cx-cw/2}" y="${cy-chh/2}" width="${cw}" height="${chh}" rx="14" fill="var(--ink)"/><text x="${cx}" y="${cy+5.5}" text-anchor="middle" style="fill:var(--bg)">${esc(mm.centro)}</text></g>`;
  return s+"</svg>";
}

/* audio */
const TTS={segs:[],i:-1,playing:false,noteId:null,timer:null};
function ttsOK(){return "speechSynthesis" in window&&typeof SpeechSynthesisUtterance!=="undefined"}
function esVoices(){if(!ttsOK())return[];return speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang)).sort((a,b)=>(b.lang==="es-ES")-(a.lang==="es-ES"))}
function parseAudio(txt){const segs=[];String(txt||"").split(/\n+/).forEach(l=>{l=l.trim();if(!l)return;
  if(/^\[PAUSA\]$/i.test(l)){segs.push({k:"p",t:""});return}
  const q=l.match(/^PREGUNTA:\s*(.*)$/i);if(q){segs.push({k:"q",t:q[1]});return}
  l.split(/(?<=[.!?…])\s+/).forEach(s=>s.trim()&&segs.push({k:"s",t:s.trim()}))});return segs}
function tAudio(n){
  const o=outsOf(n.id);const bk=n.id+":audio";const m=getMeta();const voices=esVoices();
  const active=TTS.noteId===n.id;const segs=o.audio?parseAudio(o.audio):[];
  return `<div class="stack"><div class="row between"><span class="label">Explicación en audio</span>${canAI()?`<button class="btn sm ${o.audio?"":"primary"}" data-act="gen" data-kind="audio" ${ui.busy[bk]?"disabled":""}>${I.spark}${o.audio?"Regenerar guion":"Generar explicación"}</button>`:""}</div>
  <p class="small muted">Una explicación hablada con pausas y preguntas. Cuando suene una pregunta, responde en voz alta antes de que llegue la respuesta: escuchar sin más equivale a releer.</p>
  ${ui.busy[bk]?busyBox(bk,"Escribiendo el guion…"):""}${errBox(bk)}
  ${o.audio?`${ttsOK()?`<div class="row">
    <button class="btn primary" data-act="ttsplay" data-id="${n.id}">${active&&TTS.playing?I.pause+"Pausa":I.play+(active&&TTS.i>0?"Seguir":"Escuchar")}</button>
    <button class="btn" data-act="ttsstop">${I.stop}Detener</button>
    <label class="row small" style="gap:6px">Velocidad <select id="ttsRate" style="width:auto">${[0.8,0.9,1,1.1,1.25,1.5].map(r=>`<option value="${r}" ${Number(m.rate||1)===r?"selected":""}>${String(r).replace(".",",")}×</option>`).join("")}</select></label>
    ${voices.length>1?`<label class="row small" style="gap:6px">Voz <select id="ttsVoice" style="width:auto;max-width:200px">${voices.map(v=>`<option value="${esc(v.name)}" ${m.voice===v.name?"selected":""}>${esc(v.name)}</option>`).join("")}</select></label>`:""}
  </div>`:`<div class="notice warn small">Este navegador no puede leer en voz alta. Puedes leer el guion abajo.</div>`}
  <div class="seglist" id="seglist">${segs.map((s,i)=>`<p class="${s.k==="q"?"q":""} ${active&&TTS.i===i?"on":""}" data-seg="${i}">${s.k==="p"?'<span class="muted mono small">· pausa ·</span>':s.k==="q"?"Pregunta: "+esc(s.t):esc(s.t)}</p>`).join("")}</div>`:ui.busy[bk]?`<div class="prose raw" id="stream-audio"></div>`:`<p class="muted">Todavía no hay explicación en audio.</p>`}</div>`;
}
function ttsPlay(noteId){
  if(!ttsOK())return;
  if(TTS.noteId===noteId&&TTS.playing){speechSynthesis.cancel();clearTimeout(TTS.timer);TTS.playing=false;render();return}
  if(TTS.noteId!==noteId){TTS.i=0;TTS.noteId=noteId}
  TTS.segs=parseAudio(outsOf(noteId).audio);if(TTS.i<0||TTS.i>=TTS.segs.length)TTS.i=0;
  TTS.playing=true;render();ttsStep();
}
function ttsStep(){
  if(!TTS.playing)return;
  if(TTS.i>=TTS.segs.length){TTS.playing=false;TTS.i=-1;render();return}
  hiSeg();const s=TTS.segs[TTS.i];
  if(s.k==="p"){TTS.timer=setTimeout(()=>{TTS.i++;ttsStep()},1800);return}
  const u=new SpeechSynthesisUtterance(s.k==="q"?"Pregunta. "+s.t:s.t);const m=getMeta();u.lang="es-ES";u.rate=Number(m.rate||1);
  const v=esVoices().find(v=>v.name===m.voice)||esVoices()[0];if(v)u.voice=v;
  u.onend=()=>{if(!TTS.playing)return;TTS.timer=setTimeout(()=>{TTS.i++;ttsStep()},s.k==="q"?7000:250)};
  u.onerror=()=>{TTS.playing=false;render()};
  speechSynthesis.speak(u);
}
function hiSeg(){document.querySelectorAll("#seglist p").forEach(p=>p.classList.toggle("on",Number(p.dataset.seg)===TTS.i));const on=$("#seglist p.on");if(on)on.scrollIntoView({block:"nearest"})}
function ttsStop(){if(ttsOK())speechSynthesis.cancel();clearTimeout(TTS.timer);TTS.playing=false;TTS.i=-1;render()}

/* traducción (idiomas) */
function glossary(n,src){
  const decks=myNotes().filter(x=>x.lang===n.lang).flatMap(x=>(state.decks[x.id]||{cards:[]}).cards.map(c=>({...c,note:x.title})));
  const base=c=>norm(String(c.f).split(/[,(]/)[0].trim());
  const out=[];const seen=new Set();
  for(const w of wordsOf(src)){const nw=norm(w);if(nw.length<2||seen.has(nw))continue;seen.add(nw);
    const root=nw.slice(0,Math.max(3,Math.min(5,nw.length-1)));
    const hits=decks.filter(c=>{const b=base(c);return b&&b.length>=2&&(b===nw||(b.length>=4&&nw.startsWith(b.slice(0,Math.min(b.length-1,5))))||b.startsWith(root))}).slice(0,2);
    out.push({w,hits});
  }
  return out;
}

}

/* generación */
const PROMPT={
  summary:"Escribe un resumen estructurado en Markdown (títulos ##, viñetas, **negritas** solo para términos clave). Prioriza relaciones causa-efecto y el porqué de las cosas, no solo el qué. Máximo 400 palabras. Termina con una línea que empiece por '> ' con 3 preguntas de autoexamen que obliguen a recordar sin mirar.",
  outline:"Escribe un esquema jerárquico en Markdown usando listas numeradas con sangría de dos espacios por nivel (máximo 3 niveles). Frases muy cortas, sin párrafos. Respeta el orden lógico del tema.",
  mindmap:`Crea un mapa mental del tema con esta forma JSON: {"centro":"Tema","ramas":[{"t":"Idea","h":[{"t":"Detalle","h":[{"t":"Subdetalle"}]}]}]}. Entre 4 y 7 ramas, de 2 a 5 hijos por rama, como mucho un nivel más. Cada etiqueta de 1 a 5 palabras.`,
  quiz:`Crea un quiz de 8 preguntas tipo test con 4 opciones. Mezcla recuerdo, comprensión y aplicación a casos nuevos. Los distractores deben ser errores típicos plausibles. La explicación dice por qué la correcta lo es (máx. 40 palabras). Varía la posición de la correcta. Formato: un JSON array [{"p":"pregunta","o":["A","B","C","D"],"c":0,"e":"explicación"}].`,
  audio:"Escribe el guion de una explicación hablada de 3 a 4 minutos (unas 450 palabras) para escuchar. Estilo de profesor cercano que habla, no que lee: frases cortas, una idea por frase, ejemplos o analogías concretas. Formato estricto, una línea por frase: escribe [PAUSA] solo en una línea para una pausa; escribe 'PREGUNTA: ...' en una línea para preguntar al oyente, y en la línea siguiente la respuesta breve. Incluye 3 preguntas repartidas. Sin títulos, sin Markdown, sin emojis.",
  ocr:"Estas imágenes son fotos de apuntes o páginas de libro de un estudiante, en orden. Transcribe fielmente todo el contenido en castellano, en Markdown sencillo: títulos con ##, listas con -, fórmulas en notación legible (H₂O, x², √). Describe en una línea entre corchetes los dibujos o diagramas importantes. Marca [ilegible] lo que no se lea. No añadas nada que no esté en las imágenes."
};
const KIND_KEY={summary:"resumen",outline:"esquema",mindmap:"mapa",cards:"tarjetas",quiz:"quiz",exam:"examen",audio:"audio"};
async function gen(n,kind,forceLocal=false){
  const o=outsOf(n.id);const useAI=hasAI()&&!forceLocal;const base=aiCtx(n);
  if(kind==="audio"&&TTS.noteId===n.id)ttsStop();
  await runAI(n.id+":"+KIND_KEY[kind],async signal=>{
    await new Promise(r=>setTimeout(r,40));
    if(kind==="summary")o.summary=useAI?await llm(base+PROMPT.summary,{signal}):localSummary(n);
    else if(kind==="outline")o.outline=useAI?await llm(base+PROMPT.outline,{signal}):localOutline(n);
    else if(kind==="mindmap"){const r=useAI?await llm(base+PROMPT.mindmap,{json:true,signal}):localMap(n);if(!r||!Array.isArray(r.ramas))throw{code:"json"};o.mindmap=r;ui.revealed=new Set()}
    else if(kind==="cards"){
      const d=deckOf(n.id);const have=d.cards.map(c=>c.f).slice(0,80).join("\n");
      const r=useAI?await llm(base+`Crea entre 10 y 18 tarjetas de memoria. Reglas: una sola idea por tarjeta; la pregunta obliga a producir la respuesta; respuestas breves (máx. 25 palabras); mezcla definiciones, causas (¿por qué…?), comparaciones y aplicaciones; algunas pueden ser de completar con _____. ${n.lang==="la"||n.lang==="grc"?"Incluye tarjetas de vocabulario (enunciado → significado), de morfología (forma concreta → análisis completo) y de etimología (palabra castellana → étimo). ":n.lang?"Incluye vocabulario, gramática y frases de uso. ":""}${have?"No repitas estas:\n"+have+"\n":""}Formato: JSON array [{"f":"pregunta","b":"respuesta"}].`,{json:true,signal}):localCards(n);
      if(!Array.isArray(r))throw{code:"json"};
      const ex=new Set(d.cards.map(c=>norm(c.f)));let added=0;
      r.forEach(c=>{if(c&&c.f&&c.b&&!ex.has(norm(c.f))){ex.add(norm(c.f));d.cards.push({id:uid(),f:String(c.f).slice(0,400),b:String(c.b).slice(0,600)});added++}});
      if(!added&&!useAI&&!r.length)throw{code:"short"};
      saveDeck(n.id);toast(added?added+" tarjetas nuevas":"No hay tarjetas nuevas que crear con este texto");return;
    }
    else if(kind==="quiz"){const r=useAI?await llm(base+PROMPT.quiz,{json:true,signal}):localQuiz(n);if(!Array.isArray(r)||!r.length)throw{code:"json"};
      o.quiz=r.filter(q=>q&&q.p&&Array.isArray(q.o)&&q.o.length>=2).map(q=>({p:q.p,o:q.o.slice(0,4),c:Math.min(Math.max(0,Number(q.c)||0),3),e:q.e||""}));ui.quiz=null}
    else if(kind==="exam"){const r=useAI?await llm(base+`Redacta un examen como los de ${prof().level} en España: 5 preguntas tipo test (4 opciones) y 3 preguntas de desarrollo corto (${n.lang==="la"||n.lang==="grc"?"una de traducción con análisis morfosintáctico de una frase breve, una de morfología o sintaxis y una de etimología o léxico":n.lang?"una de traducción, una de gramática y una de expresión escrita breve":"definir, explicar un proceso, relacionar o aplicar"}). Para cada pregunta de desarrollo incluye los puntos clave de una respuesta completa (como palabras o expresiones cortas) y una respuesta modelo breve. Formato JSON: {"test":[{"p":"","o":["","","",""],"c":0,"e":""}],"abiertas":[{"p":"","clave":["concepto 1","concepto 2"],"modelo":""}]}.`,{json:true,signal}):localExam(n);
      if(!r||!Array.isArray(r.test)||!Array.isArray(r.abiertas))throw{code:"json"};o.exam=r;ui.exam=null}
    else if(kind==="audio")o.audio=useAI?await llm(base+PROMPT.audio,{signal}):localAudio(n);
    saveOuts(n.id);
  },kind);
}

/* ============ repasar ============ */
function vRepasar(){
  const R=ui.review;
  if(!R||R.done){
    const due=dueCards();const notes=myNotes();const total=notes.reduce((a,n)=>a+((state.decks[n.id]||{cards:[]}).cards.length),0);
    const m=getMeta();const rv=m.reviews[today()]||0;
    return `<div class="topbar"><h1>Repasar</h1></div>
    ${R&&R.done?`<div class="card lift stack" style="text-align:center;align-items:center"><span class="label">Repaso terminado</span><h2>${R.count} tarjetas · ${R.count?Math.round(R.good/R.count*100):0}% recordadas</h2><p class="muted">Ahora toca descansar unos minutos sin pantallas: ayuda a consolidar lo que acabas de recuperar.</p></div>`:""}
    <div class="card stack" style="align-items:flex-start">
      <h2>${due.length?`${due.length} tarjeta${due.length>1?"s":""} para hoy`:"Todo al día"}</h2>
      <p class="muted">${due.length?"Se mezclan asignaturas a propósito: alternar temas obliga a identificar qué estrategia toca en cada pregunta, y eso mejora el resultado en el examen.":`Has repasado ${rv} tarjetas hoy. Tienes ${total} en total; volverán cuando estén a punto de olvidarse.`}</p>
      ${due.length?`<button class="btn primary" data-act="startreview">Empezar repaso</button>`:`<button class="btn" data-act="go" data-view="apuntes">Crear más tarjetas</button>`}
    </div>
    <div class="notice small"><b>Cómo funciona:</b> después de ver la respuesta, sé honesto. <b>Otra vez</b> la devuelve en 10 minutos; <b>Bien</b> y <b>Fácil</b> la alejan cada vez más (1 día, 3 días, una semana…). Si tienes un examen apuntado de esa asignatura, ninguna tarjeta se aleja más allá de la fecha.</div>`;
  }
  const it=R.queue[R.i];if(!it){R.done=true;return vRepasar()}
  const c=state.decks[it.noteId].cards.find(x=>x.id===it.card.id)||it.card;
  const prev=[1,2,3,4].map(r=>fmtIv(schedule(c,r,it.subject)));
  const nl=(state.notes[it.noteId]||{}).lang||"";const ansKbd=hasGreek(c.b)?"greek":(nl==="la"?"latin":"none");
  const sideLang=x=>hasGreek(x)?"grc":(nl&&!/[¿¡]/.test(x)?nl:"");
  const sug=R.verdict==="ok"?3:R.verdict==="acc"||R.verdict==="near"?2:R.verdict==="no"?1:0;
  return `<div class="topbar"><h1>Repasar</h1><button class="btn ghost" data-act="endreview">Terminar</button></div>
  <div class="stack"><div class="row between"><span class="label">${R.i+1} / ${R.queue.length} · ${esc(it.subject||"")}</span><span class="label">${esc(state.notes[it.noteId]?.title||"")}</span></div>
  <div class="progress"><i style="width:${R.i/R.queue.length*100}%"></i></div></div>
  <div class="row between"><div class="seg"><button data-act="typedmode" data-v="0" aria-pressed="${!ui.typed}">Pensar la respuesta</button><button data-act="typedmode" data-v="1" aria-pressed="${ui.typed}">Escribirla</button></div>
  ${ui.typed?`<label class="row small" style="gap:6px"><input type="checkbox" data-act="strict" ${ui.strict?"checked":""}> Exigir acentos${hasGreek(c.b)?" y espíritus":""}</label>`:""}</div>
  <div class="flash"><div class="row" style="justify-content:center;gap:6px"><div class="q">${esc(c.f)}</div>${sideLang(c.f)?`<button class="spk" data-act="speak" data-text="${esc(c.f)}" data-lang="${sideLang(c.f)}" aria-label="Escuchar">${I.spk}</button>`:""}</div>
  ${R.shown?`<div class="a">${esc(c.b)}${sideLang(c.b)?` <button class="spk" data-act="speak" data-text="${esc(c.b)}" data-lang="${sideLang(c.b)}" aria-label="Escuchar">${I.spk}</button>`:""}</div>`:ui.typed?"":`<p class="muted small">Responde mentalmente (o en voz alta) antes de darle la vuelta.</p>`}</div>
  ${ui.typed&&!R.shown?`<form class="stack" data-form="typed">${ansKbd!=="none"?kbdBar():""}<div class="typed"><input type="text" id="typedIn" autocomplete="off" autocapitalize="off" spellcheck="false" data-kbd="${ansKbd==="none"?"":ansKbd}" placeholder="Escribe tu respuesta"><button class="btn primary" type="submit">Comprobar</button></div></form>`:""}
  ${R.shown&&R.verdict?`<div class="verdict ${R.verdict==="ok"?"ok":R.verdict==="no"?"no":"near"}">${R.verdict==="ok"?"Correcto":R.verdict==="acc"?"Bien, pero revisa acentos o espíritus":R.verdict==="near"?"Casi: hay una letra distinta":"No es esa"}${R.given?` · escribiste: <span style="font-weight:400">${esc(R.given)}</span>`:""}</div>`:""}
  ${R.shown?`<div class="rate">${["Otra vez","Difícil","Bien","Fácil"].map((l,i)=>`<button class="r${i+1} ${sug===i+1?"sug":""}" data-act="rate" data-r="${i+1}">${l}<small>${prev[i]}</small></button>`).join("")}</div><p class="small muted" style="text-align:center">Teclas 1–4</p>`
  :ui.typed?"":`<button class="btn primary" data-act="flip" style="padding:14px">Mostrar respuesta <span class="mono small" style="opacity:.7">(espacio)</span></button>`}`;
}
function startReview(noteId){const q=dueCards(noteId);if(!q.length){toast("No hay tarjetas pendientes");return}ui.review={queue:q,i:0,shown:false,count:0,good:0,done:false};go("repasar")}
function rate(r){
  const R=ui.review;const it=R.queue[R.i];const d=state.decks[it.noteId];const idx=d.cards.findIndex(x=>x.id===it.card.id);
  if(idx<0){R.i++;R.shown=false;render();return}
  const wasNew=d.cards[idx].due===undefined;
  d.cards[idx]=schedule(d.cards[idx],r,it.subject);saveDeck(it.noteId);
  const m=getMeta();const t=today();m.reviews[t]=(m.reviews[t]||0)+1;
  if(wasNew){m.newToday=m.newToday&&m.newToday.d===t?{d:t,n:m.newToday.n+1}:{d:t,n:1}}
  markActive();
  R.count++;if(r>=3)R.good++;
  if(r===1)R.queue.push({...it,card:d.cards[idx]});
  R.i++;R.shown=false;R.verdict=null;R.given="";
  if(R.i>=R.queue.length){R.done=true;saveMeta()}
  else if(R.count%10===0)saveMeta();
  render();
}

/* ============ sesión / temporizador ============ */
const PRESETS={
  p24:{label:"24 · 6",focus:24,brk:6,long:20,name:"Pomodoro estudiado",desc:"El esquema que, frente a pausas libres, dio menos fatiga y más concentración con el mismo trabajo hecho."},
  p12:{label:"12 · 3",focus:12,brk:3,long:15,name:"Arranque corto",desc:"Mismo estudio, bloques más cortos. Para días de poca energía, temas que cuestan o para empezar a coger hábito."},
  p45:{label:"45 · 10",focus:45,brk:10,long:25,name:"Bloque largo",desc:"Para universidad, problemas largos o lectura densa. Es práctica habitual; no hay un estudio que lo compare directamente."}
};
const T={preset:"p24",phase:"idle",block:1,total:4,endAt:0,left:0,running:false,brkMode:"alterna",lastBrk:"quieto",tick:null,started:0,focusAcc:0,wake:null};
function loadTimerPref(){try{const s=JSON.parse(lsGet("mv_timer")||"{}");if(PRESETS[s.preset])T.preset=s.preset;if(s.brkMode)T.brkMode=s.brkMode;if(s.total)T.total=s.total}catch{}}
function saveTimerPref(){lsSet("mv_timer",JSON.stringify({preset:T.preset,brkMode:T.brkMode,total:T.total}))}
const phaseLen=()=>{const p=PRESETS[T.preset];return(T.phase==="focus"?p.focus:T.phase==="long"?p.long:p.brk)*60000};
function curBreakType(){if(T.phase==="long")return"largo";if(T.brkMode==="alterna")return T.block%2===0?"activo":"quieto";return T.brkMode}
function vSesion(){
  const p=PRESETS[T.preset];const idle=T.phase==="idle";const isBrk=T.phase==="break"||T.phase==="long";
  const bt=curBreakType();
  return `<div class="topbar"><h1>Sesión de estudio</h1>${!idle?`<button class="btn ghost" data-act="tend">Terminar sesión</button>`:""}</div>
  ${ui.dump?vDump():""}
  <div class="timer">
    <div class="card lift stack" style="align-items:center;gap:16px">
      <div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="none" stroke="var(--surface-2)" stroke-width="8"/><circle id="ringArc" cx="60" cy="60" r="54" fill="none" stroke="${isBrk?"var(--ok)":"var(--accent)"}" stroke-width="8" stroke-linecap="round" stroke-dasharray="339.3" stroke-dashoffset="0"/></svg>
        <div class="center"><span class="phase-pill ${isBrk?"brk":""}">${idle?"Preparado":T.phase==="focus"?"Foco":T.phase==="long"?"Descanso largo":"Pausa"}</span><span class="time" id="ringTime">${idle?p.focus+":00":"--:--"}</span><span class="small muted">Bloque ${Math.min(T.block,T.total)} de ${T.total}</span></div></div>
      <div class="blocks">${Array.from({length:T.total},(_,i)=>`<i class="${i+1<T.block?"done":i+1===T.block&&!idle?"now":""}"></i>`).join("")}</div>
      <div class="row" style="justify-content:center">
        ${idle?`<button class="btn primary" data-act="tstart" style="padding:12px 22px">${I.play}Empezar</button>`
        :`<button class="btn primary" data-act="tpause">${T.running?I.pause+"Pausar":I.play+"Seguir"}</button><button class="btn" data-act="tskip">Saltar ${T.phase==="focus"?"a la pausa":"al foco"}</button>`}
      </div>
    </div>
    <div class="stack">
      ${isBrk?breakGuide(bt):idle?`
      <div class="stack"><span class="label">Ritmo</span>${Object.entries(PRESETS).map(([k,v])=>`<button class="preset" data-act="preset" data-k="${k}" aria-pressed="${T.preset===k}"><span class="row between"><b>${v.label}</b><span class="small muted">${v.name}</span></span><span class="small muted">${v.desc}</span></button>`).join("")}</div>
      <div class="stack" style="gap:8px"><span class="label">Bloques</span><div class="seg">${[2,3,4,6].map(nb=>`<button data-act="tblocks" data-n="${nb}" aria-pressed="${T.total===nb}">${nb}</button>`).join("")}</div></div>
      <div class="stack" style="gap:8px"><span class="label">Tipo de pausa</span><div class="seg">${[["alterna","Alternar"],["quieto","Descanso quieto"],["activo","Pausa activa"]].map(([k,l])=>`<button data-act="tbrk" data-k="${k}" aria-pressed="${T.brkMode===k}">${l}</button>`).join("")}</div>
      <p class="small muted">Tras aprender algo nuevo, unos minutos quieto y sin estímulos ayudan a que se consolide. Moverse después de estudiar también mejora el recuerdo. Alternar te da las dos cosas.</p></div>`
      :`<div class="card stack"><h3>Durante el foco</h3><ul class="small" style="margin:0;padding-left:1.2em;line-height:1.7"><li>Móvil fuera de la vista, no solo boca abajo.</li><li>Una sola tarea. Si te viene una idea ajena, apúntala y sigue.</li><li>Termina cada bloque preguntándote qué acabas de aprender, sin mirar.</li></ul></div>
      <div class="card stack"><h3>Cuando acabe</h3><p class="small muted">Al terminar la sesión tendrás 2 minutos de <b>recuerdo libre</b>: escribir todo lo que recuerdes. Es la forma más simple de práctica de recuperación.</p></div>`}
    </div>
  </div>`;
}
function breakGuide(bt){
  if(bt==="quieto")return`<div class="break-guide stack"><span class="label" style="color:var(--ok)">Descanso quieto</span><h3>Cierra los ojos o mira por la ventana</h3><p>Sin móvil, sin redes, sin vídeos. Respira despacio. Si te viene a la cabeza lo que estudiabas, déjalo pasar.</p><p class="small muted">En un experimento, 10 minutos de reposo tranquilo tras aprender mejoraron el recuerdo una semana después frente a hacer una tarea distraída.</p></div>`;
  if(bt==="activo")return`<div class="break-guide stack"><span class="label" style="color:var(--ok)">Pausa activa</span><h3>Mueve el cuerpo unos minutos</h3><ol class="small" style="margin:0;padding-left:1.2em;line-height:1.8"><li>Levántate y bebe agua.</li><li>20 sentadillas o subir y bajar una escalera.</li><li>Rotaciones de hombros y cuello, 30 segundos.</li><li>Estira espalda y piernas, 1 minuto.</li><li>Mira lejos (más de 6 metros) unos segundos para relajar la vista.</li></ol><p class="small muted">Un ejercicio breve después de aprender se asocia a mejor recuerdo posterior. Sin pantallas.</p></div>`;
  return`<div class="break-guide stack"><span class="label" style="color:var(--ok)">Descanso largo</span><h3>Has completado una vuelta</h3><p>Sal de la habitación, come algo, camina o charla con alguien. Lo que has estudiado se sigue asentando mientras descansas de verdad.</p><p class="small muted">Después del último bloque del día, prioriza dormir bien: el sueño es cuando más se consolida lo aprendido.</p></div>`;
}
function vDump(){
  const D=ui.dump;const notes=myNotes();const bk="dump";

  <p class="muted small">Sin mirar nada, escribe todo lo que recuerdes de lo que has estudiado: ideas, datos, relaciones, dudas. Lo que no sale es lo que hay que repasar.</p>

}
function tStart(){T.phase="focus";T.block=1;T.left=phaseLen();T.running=true;T.endAt=Date.now()+T.left;T.focusAcc=0;ensureTick();wake(true);beep(660);render()}
function tPause(){if(T.running){T.left=Math.max(0,T.endAt-Date.now());T.running=false;wake(false)}else{T.endAt=Date.now()+T.left;T.running=true;wake(true)}render()}
function addFocus(ms){const min=Math.round(ms/60000);if(min<=0)return;const m=getMeta();const t=today();m.focus[t]=(m.focus[t]||0)+min;markActive();saveMeta()}
function advance(){
  if(T.phase==="focus"){addFocus(phaseLen()-(T.running?Math.max(0,T.endAt-Date.now()):T.left));
    if(T.block>=T.total){finishSession(true);return}
    T.phase=(T.block%4===0)?"long":"break";beep(520,2)}
  else{T.phase="focus";T.block++;beep(780,2)}
  T.left=phaseLen();T.endAt=Date.now()+T.left;T.running=true;render();
}
function finishSession(completed){
  if(T.phase==="focus"&&!completed){const done=phaseLen()-(T.running?Math.max(0,T.endAt-Date.now()):T.left);if(done>60000)addFocus(done)}
  T.phase="idle";T.running=false;T.block=1;wake(false);clearInterval(T.tick);T.tick=null;
  document.title="Memoria Viva";ui.dump={text:"",noteId:ui.dump?.noteId||null};$("#timerMini").classList.remove("on");
  if(completed)beep(880,3);go("sesion");
}
function ensureTick(){if(T.tick)return;T.tick=setInterval(()=>{if(T.phase==="idle")return;if(T.running&&Date.now()>=T.endAt){advance();return}paintTimer()},500)}
function paintTimer(){
  const mini=$("#timerMini");
  if(T.phase==="idle"){mini.classList.remove("on");return}

function examEstimate(){
